site_name: 博客知识体系
site_description: 个人技术博客 - 大语言模型、容器化技术等
site_url: https://try-agaaain.github.io/blogs
repo_url: https://github.com/try-agaaain/blogs
repo_name: try-agaaain/blogs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换亮色模式

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html

nav:
  - 首页: index.md
  - 知识体系构建方法论: 知识体系构建方法论.md
  - 大语言模型:
    - 大模型网络结构: 大语言模型/大模型网络结构/封面.md
  - 容器化技术: 容器化技术/封面.md
  - LagerLanguageModel: LagerLanguageModel/rag-系统评估-ragas-核心指标.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/try-agaaain/blogs

copyright: Copyright &copy; 2026 try-agaaain

plugins:
  - search
  - git-revision-date-localized:
      type: date
